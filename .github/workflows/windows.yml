name: Windows preview checks
on:
  workflow_dispatch:
  pull_request:
    paths: ['Windows/**', '.github/workflows/windows.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: Windows/global.json
      - name: Core checks, native checks and x64 package
        shell: pwsh
        run: ./Windows/build.ps1 -Runtime win-x64
      - name: Cross-publish ARM64 (not runtime-tested here)
        shell: pwsh
        run: ./Windows/build.ps1 -Runtime win-arm64 -SkipTests
      - uses: actions/upload-artifact@v7
        with:
          name: Swivel-Windows-preview
          path: build/windows/*.zip
          if-no-files-found: error
